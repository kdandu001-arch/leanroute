[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "leanroute"
version = "0.1.0"
description = "Put a fast, calibrated decision layer (Laya) in front of any LLM: guard, route and cut costs."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Kushal" }]
keywords = ["llm", "router", "guardrails", "laya", "cost", "openai", "classification"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
local = ["laya>=0.3.6"]          # run Laya in-process (downloads the model)
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/kdandu001-arch/leanroute"

[tool.hatch.build.targets.wheel]
packages = ["src/leanroute"]
