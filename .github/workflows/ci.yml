name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install (no model download; tests use stand-in engines)
        run: |
          pip install fastapi "uvicorn[standard]" httpx pydantic pytest
          pip install -e ./sdk
      - name: Server tests
        run: cd server && PRELOAD=false pytest -q
      - name: SDK tests
        run: cd sdk && pytest -q
